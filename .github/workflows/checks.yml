name: Reproduce scores and check geometry
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-analysis:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/project.py verify
      - run: python scripts/project.py test-metrics
      - run: python scripts/project.py analyze
  analytic-integrators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.23.5 scipy==1.10.1
      - run: python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/project.py test-integrators
